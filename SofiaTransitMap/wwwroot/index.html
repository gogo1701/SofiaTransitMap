<!--
THESIS: A civic timetable instrument for Sofia: live vehicles, door-to-door journeys and honest punctuality numbers in one calm, municipal surface.
OWN-WORLD: Borrows the Urban Mobility Center's world: navy #2B3C8F, the four mode colours (bus red, tram orange, trolley blue, metro line colours), Sofia Sans, square 4px badges, signage-like condensed line numbers.
STORY: Map first. Vehicles glide along their streets; pick a stop for departures, plan a trip from any address at any hour, then read how the network is actually keeping time.
FIRST VIEWPORT: Navy header with tabs, a white working panel on the left, the live city map filling the rest.
FORM: Dense, tabular, sign-like. Numbers in Sofia Sans Condensed with tabular figures, colour only where it carries meaning (mode, delay).
-->
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Градски транспорт София</title>
    <meta name="description" content="Карта на градския транспорт в София на живо, планиране на маршрут и статистика за закъсненията." />
    <meta name="theme-color" content="#2B3C8F" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232B3C8F'/%3E%3Cpath d='M8 21V11a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10' stroke='white' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='12' cy='23' r='2' fill='white'/%3E%3Ccircle cx='20' cy='23' r='2' fill='white'/%3E%3Cpath d='M8 15h16' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <a class="skip-link" href="#panel" data-i18n="skip">Към съдържанието</a>

    <header class="topbar">
        <a class="brand" href="#/map" aria-label="Градски транспорт София" data-i18n-aria="brand.aria">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect width="32" height="32" rx="6" fill="#fff" />
                <path d="M8 21V11a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10" stroke="#2B3C8F" stroke-width="2.5" fill="none" />
                <circle cx="12" cy="23" r="2" fill="#2B3C8F" />
                <circle cx="20" cy="23" r="2" fill="#2B3C8F" />
                <path d="M8 15h16" stroke="#2B3C8F" stroke-width="2" />
            </svg>
            <span class="brand-text">
                <strong data-i18n="brand.title">Градски транспорт</strong>
                <span data-i18n="brand.city">Столична община</span>
            </span>
        </a>

        <nav class="tabs" aria-label="Основна навигация" data-i18n-aria="nav.main">
            <a href="#/map" data-tab="map" data-i18n="tab.map">Карта</a>
            <a href="#/plan" data-tab="plan" data-i18n="tab.plan">Маршрут</a>
            <a href="#/lines" data-tab="lines" data-i18n="tab.lines">Линии</a>
            <a href="#/stats" data-tab="stats" data-i18n="tab.stats">Статистика</a>
            <a href="#/alerts" data-tab="alerts">
                <span data-i18n="tab.alerts">Съобщения</span>
                <span class="tab-count" id="alertCount" hidden></span>
            </a>
        </nav>

        <div class="topbar-tools">
            <span class="live-pill" id="livePill" data-state="loading" role="status">
                <span class="live-dot" aria-hidden="true"></span>
                <span id="liveText" data-i18n="live.loading">Зареждане…</span>
            </span>
            <div class="lang-switch" role="group" aria-label="Език / Language">
                <button type="button" data-lang="bg" aria-pressed="true">БГ</button>
                <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
        </div>
    </header>

    <main class="shell" id="shell">
        <aside class="panel" id="panel" tabindex="-1" aria-live="polite">
            <button type="button" class="sheet-handle" id="sheetHandle" aria-label="Разгъни панела" data-i18n-aria="sheet.toggle"></button>
            <div class="panel-body" id="panelBody"></div>
        </aside>

        <section class="map-wrap" aria-label="Карта" data-i18n-aria="map.label">
            <div id="map"></div>
            <div class="map-controls" id="mapControls">
                <button type="button" class="map-btn" id="locateBtn" title="Моето местоположение" data-i18n-title="map.locate">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="7.5" /></svg>
                </button>
                <button type="button" class="map-btn" id="layersBtn" aria-expanded="false" aria-controls="layersMenu" title="Слоеве" data-i18n-title="map.layers">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z" /><path d="m2 13 10 5 10-5" /><path d="m2 18 10 5 10-5" opacity=".5" /></svg>
                </button>
                <div class="layers-menu" id="layersMenu" hidden></div>
            </div>
            <div class="map-legend" id="mapLegend"></div>
        </section>

        <section class="page" id="page" hidden></section>
    </main>

    <div class="toast" id="toast" role="alert" hidden></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
